name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3] # Adjust based on the number of shards you want
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16' # Specify the Node.js version

      - name: Install dependencies
        run: npm install

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }} --project=chromium --reporter=html --timeout=30000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v2
        with:
          name: test-results
          path: test-results/ # Adjust based on your results path

      - name: Notify on failure
        if: failure()
        run: echo "Some tests failed. Please check the logs."